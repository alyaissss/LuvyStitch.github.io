<!-- LuvyStitch Navbar Component -->
<header
  id="luvystitch-navbar"
  class="w-full z-50 bg-surface/70 backdrop-blur-lg shadow-lg border-b border-outline-variant/20"
>
  <div
    class="max-w-container-max mx-auto px-margin flex justify-between items-center h-20"
  >
    <!-- Logo -->
    <a
      href="index.html"
      class="flex items-center gap-2 font-headline-lg text-headline-lg text-primary transition-all duration-200 hover:scale-110 hover:opacity-80 transition-opacity"
    >
      <img
        src="img/logo.png"
        alt="LuvyStitch Logo"
        class="h-12 w-12 rounded-full object-cover transition-all duration-200 hover:scale-110"
      />
      LuvyStitch
    </a>

    <!-- Mobile Menu Button -->
    <button
      id="mobile-menu-btn"
      class="md:hidden flex flex-col gap-1.5 p-2 hover:bg-surface-container rounded-lg transition-colors"
    >
      <span class="w-6 h-0.5 bg-primary transition-all"></span>
      <span class="w-6 h-0.5 bg-primary transition-all"></span>
      <span class="w-6 h-0.5 bg-primary transition-all"></span>
    </button>

    <!-- Desktop Navigation -->
    <nav id="desktop-nav" class="hidden md:flex items-center gap-gutter">
      <a
        class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md"
        href="index.html"
      >
        Home
      </a>
      <a
        class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md"
        href="patterns.html"
      >
        Patterns
      </a>
      <a
        class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md"
        href="gallery.html"
      >
        Gallery
      </a>
      <a
        class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md"
        href="community.html"
      >
        Community
      </a>
    </nav>

    <!-- Join Button -->
    <button
      id="join-btn"
      class="hidden md:inline-block bg-primary-container text-on-primary-container px-6 py-2 rounded-full font-label-lg text-label-lg hover:scale-110 transition-transform duration-300 active:scale-95 whitespace-nowrap"
    >
      Join
    </button>
  </div>

  <!-- Mobile Navigation Menu -->
  <nav
    id="mobile-nav"
    class="hidden md:hidden border-t border-outline-variant bg-surface-container-lowest animate-in slide-in-from-top-2"
  >
    <div class="max-w-container-max mx-auto px-margin py-4 flex flex-col gap-2">
      <a
        class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md py-2 px-4 hover:bg-surface-container rounded-lg"
        href="index.html"
      >
        Home
      </a>
      <a
        class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md py-2 px-4 hover:bg-surface-container rounded-lg"
        href="patterns.html"
      >
        Patterns
      </a>
      <a
        class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md py-2 px-4 hover:bg-surface-container rounded-lg"
        href="gallery.html"
      >
        Gallery
      </a>
      <a
        class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md py-2 px-4 hover:bg-surface-container rounded-lg"
        href="community.html"
      >
        Community
      </a>
    </div>
  </nav>
</header>

<!-- Join Modal -->
<div
  id="join-modal"
  class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4"
>
  <div
    class="bg-surface rounded-2xl max-w-md w-full p-8 shadow-2xl animate-in fade-in zoom-in-95"
  >
    <!-- Close Button -->
    <button
      id="close-modal"
      class="absolute top-4 right-4 text-on-surface-variant hover:text-on-surface transition-colors"
    >
      <span class="material-symbols-outlined text-[24px]">close</span>
    </button>

    <!-- Modal Content -->
    <h2 class="font-display-md text-display-md text-on-surface mb-2">
      Join LuvyStitch
    </h2>
    <p class="font-body-md text-on-surface-variant mb-8">
      Akses pola premium, workshop menarik, dan komunitas rajut yang inspiratif.
    </p>

    <!-- Form -->
    <form id="join-form" class="space-y-4">
      <div>
        <label class="block font-label-lg text-label-lg text-on-surface mb-2"
          >Email Address</label
        >
        <input
          type="email"
          placeholder="your@email.com"
          required
          class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
        />
      </div>

      <div>
        <label class="block font-label-lg text-label-lg text-on-surface mb-2"
          >Full Name</label
        >
        <input
          type="text"
          placeholder="Your name"
          required
          class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-primary text-on-primary py-3 rounded-xl font-label-lg text-label-lg hover:bg-primary/90 transition-colors mt-6"
      >
        Submit
      </button>
    </form>

    <!-- Terms -->
    <p class="text-label-sm text-on-surface-variant text-center mt-6">
      By joining, you agree to our
      <a href="#" class="text-primary hover:underline">Terms of Service</a> and
      <a href="#" class="text-primary hover:underline">Privacy Policy</a>.
    </p>
  </div>
</div>
